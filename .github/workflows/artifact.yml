name: Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/README.md'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleGoogleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error
